<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your $project_name email</title>
  <style type="text/css">
    body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .inner { padding: 32px 24px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">

  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f5f5f5;">
    <tr>
      <td style="padding: 40px 20px;">

        <table class="container" role="presentation" cellspacing="0" cellpadding="0" border="0" width="480" style="margin: 0 auto; max-width: 480px;">

          <tr>
            <td style="background-color: #ffffff; border-radius: 8px; overflow: hidden;">

              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td class="inner" style="padding: 40px 40px 36px;">

                    <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 600; color: #111; text-align: center;">
                      Confirm your email
                    </h1>

                    <p style="margin: 0 0 4px; font-size: 15px; color: #555; text-align: center;">
                      Hi <strong style="color: #111;">$username</strong>,
                    </p>

                    <p style="margin: 0 0 32px; font-size: 15px; color: #555; text-align: center;">
                      Enter this code to verify your email address.
                    </p>

                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-bottom: 24px;">
                      <tr>
                        <td style="text-align: center;">
                          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto; background-color: #f5f5f5; border-radius: 6px;">
                            <tr>
                              <td style="padding: 16px 36px;">
                                <p style="margin: 0; font-size: 32px; font-weight: 700; color: #111; letter-spacing: 8px; font-family: 'Courier New', monospace; text-align: center;">$code</p>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                    <p style="margin: 0 0 24px; font-size: 13px; color: #888; text-align: center;">
                      Expires in $valid_minutes minutes.
                    </p>

                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                      <tr>
                        <td style="border-top: 1px solid #eee; padding: 20px 0 0;">
                          <p style="margin: 0; font-size: 13px; color: #aaa; text-align: center;">
                            Sent to <strong style="color: #666;">$email</strong>
                          </p>
                          <p style="margin: 4px 0 0; font-size: 12px; color: #bbb; text-align: center;">
                            &copy; 2026 $project_name
                          </p>
                          <p style="margin: 12px 0 0; font-size: 12px; color: #bbb; text-align: center;">
                            If you didn't create an account, ignore this email.
                          </p>
                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>
              </table>

            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>

[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.139.0,<1.0.0",
    "uvicorn[standard]>=0.51.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "alembic>=1.15.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "pwdlib[argon2]>=0.2.1,<1.0.0",
    "openpyxl>=3.1.5",
    "gunicorn>=26.0.0",
    "sentry-sdk[fastapi]>=2.63.0,<3.0.0",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "redis>=8.0.1",
    "slowapi>=0.1.10,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "prek>=0.2.24,<1.0.0",
    "coverage<8.0.0,>=7.4.3",
    "httpx2>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
exclude = ["venv", ".venv", "alembic"]
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["call-overload", "arg-type", "assignment", "misc", "return-value", "union-attr"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["ARG001", "F841"]
"app/main.py" = ["ARG001"]
"app/api/routes/*" = ["ARG001"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

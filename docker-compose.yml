services:
  backend:
    build:
      context: .
      args:
        PORT: ${PORT:-8000}
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - REDIS_SERVER=redis
    ports:
      - ${PORT:-8000}:${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    ports:
      - 6379:6379
    volumes:
      - app-redis-data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    profiles:
      - dev
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - 5050:80
    volumes:
      - app-pgadmin-data:/var/lib/pgadmin

volumes:
  app-db-data:
    name: autoinvoice-db
  app-redis-data:
  app-pgadmin-data: